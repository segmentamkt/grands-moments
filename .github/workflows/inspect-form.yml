name: One-off inspect quote form
on:
  push:
    paths:
      - '.github/workflows/inspect-form.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant form text
        shell: python
        run: |
          import re
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8", errors="replace")
          pat = re.compile(r"whatsapp|tel[eé]fono|celular|phone|cotiz", re.I)
          hits = list(pat.finditer(s))
          print("MATCH_COUNT", len(hits))
          for n,m in enumerate(hits[:80], 1):
              a=max(0,m.start()-450); b=min(len(s),m.end()+650)
              frag=re.sub(r"\s+", " ", s[a:b])
              print(f"--- HIT {n} @ {m.start()} [{m.group(0)}] ---")
              print(frag)
